name: Release

# Tags are the bare version (0.0.4); v-prefixed tags (v0.0.5) work too.
on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the comment names the tag).
jobs:
  # Its own job, with no signing secrets: test code never runs next to the release key.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts \
            || { echo "::error::tag $GITHUB_REF_NAME doesn't match versionName in app/build.gradle.kts"; exit 1; }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 ndk;28.2.13676358 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 ndk;28.2.13676358 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: true

      # Repository secrets: YURLUNGR_KEYSTORE_BASE64 (base64 of the .jks), YURLUNGR_KEYSTORE_PASSWORD,
      # YURLUNGR_KEY_ALIAS and YURLUNGR_KEY_PASSWORD. See DEVELOPMENT.md, "Release signing".
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.YURLUNGR_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::YURLUNGR_KEYSTORE_BASE64 secret is not set"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APKs
        env:
          YURLUNGR_REQUIRE_RELEASE_KEY: "true"
          YURLUNGR_KEYSTORE: ${{ runner.temp }}/release.jks
          YURLUNGR_KEYSTORE_PASSWORD: ${{ secrets.YURLUNGR_KEYSTORE_PASSWORD }}
          YURLUNGR_KEY_ALIAS: ${{ secrets.YURLUNGR_KEY_ALIAS }}
          YURLUNGR_KEY_PASSWORD: ${{ secrets.YURLUNGR_KEY_PASSWORD }}
        # No daemon: nothing that saw the passwords outlives this step.
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APKs, write SHA256SUMS.txt and the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out/dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk); abi=${abi#app-}
            cp "$apk" "out/dist/yurlungr-$version-$abi.apk"
          done
          ls out/dist
          [ "$(ls out/dist/*.apk | wc -l)" -eq 5 ] || { echo "::error::expected 4 ABI APKs and a universal one"; exit 1; }
          (cd out/dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          notes="docs/releases/$version.md"
          if [ -f "$notes" ]; then cp "$notes" out/notes.md; else echo "Yurlungr $version" > out/notes.md; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Only this job may write to the repository, and it runs no build code.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: out

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: Yurlungr ${{ env.VERSION }}
          body_path: out/notes.md
          files: |
            out/dist/*.apk
            out/dist/SHA256SUMS.txt
