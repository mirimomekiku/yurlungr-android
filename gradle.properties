org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The application ID decides where the embedded runtime lives: /data/data/<id>/files/usr.
# The official Termux bootstrap and package repos are compiled for com.termux, so the
# Phase 0 spike must use it. Switch this once you build your own bootstrap with a
# matching TERMUX_APP_PACKAGE (Phase 0 step 2).
yurlungr.applicationId=com.termux
